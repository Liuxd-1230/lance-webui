model:
  path: "NousResearch/Lance-1.0"
  device: "cuda"
  dtype: "float16"

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

generation:
  default_width: 512
  default_height: 512
  default_steps: 30
  default_guidance: 7.5
  max_images: 4

video:
  max_frames: 64
  default_fps: 8
  default_frames: 16

output:
  directory: "outputs"
  format: "png"
